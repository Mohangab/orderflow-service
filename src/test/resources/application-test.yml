spring:
  datasource:
    url: jdbc:h2:mem:orderflow;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  kafka:
    bootstrap-servers: ${spring.embedded.kafka.brokers}

app:
  kafka:
    partitions: 1
  outbox:
    poll-interval: PT0.2S
  processing:
    max-order-amount: "1000.00"
    out-of-stock-skus:
      - SKU-OUT-OF-STOCK

logging:
  level:
    org.apache.kafka: WARN
    kafka: WARN
    org.apache.zookeeper: WARN
    state.change.logger: WARN
